info:
  name: "ETag merken"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products/{{productId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("etag", res.getHeader("etag"));
    - type: tests
      code: |-
        test("ETag vorhanden", function () {
          expect(res.getHeader("etag")).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
