info:
  name: "Aufräumen"
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/products/{{productId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
