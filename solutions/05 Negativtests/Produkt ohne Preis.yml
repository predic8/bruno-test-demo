info:
  name: "Produkt ohne Preis"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Bruno-Ohne-Preis"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status ist 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Content-Type ist application/problem+json", function () {
          expect(res.getHeader("content-type")).to.contain("application/problem+json");
        });

        test("Fehler betrifft das Feld price", function () {
          const errors = res.getBody().validation.errors;
          expect(errors).to.have.property("REQUEST/BODY#/price");
          expect(errors["REQUEST/BODY#/price"][0].message).to.contain("price is missing");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
