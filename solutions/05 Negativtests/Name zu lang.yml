info:
  name: "Name zu lang"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Eine-viel-zu-lange-Frucht-mit-Namen",
        "price": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status ist 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Content-Type ist application/problem+json", function () {
          expect(res.getHeader("content-type")).to.contain("application/problem+json");
        });

        test("Fehler betrifft das Feld name", function () {
          expect(res.getBody().validation.errors).to.have.property("REQUEST/BODY#/name");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
