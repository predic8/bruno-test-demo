info:
  name: "Produktliste gegen Schema"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const tv4 = require("tv4");

        const listSchema = {
          type: "object",
          required: ["meta", "products"],
          properties: {
            meta: {
              type: "object",
              required: ["count"],
              properties: {
                count: { type: "integer" },
                start: { type: "integer" },
                limit: { type: "integer" },
                next_link: { type: "string" },
                previous_link: { type: "string" }
              }
            },
            products: {
              type: "array",
              items: {
                type: "object",
                required: ["id", "name", "self_link"],
                properties: {
                  id: { type: "integer" },
                  name: { type: "string" },
                  self_link: { type: "string" }
                }
              }
            }
          }
        };

        test("Liste entspricht dem Schema", function () {
          const result = tv4.validateMultiple(res.getBody(), listSchema);
          expect(result.errors.map((e) => e.dataPath + ": " + e.message)).to.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
