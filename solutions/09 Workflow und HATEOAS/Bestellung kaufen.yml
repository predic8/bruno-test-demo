info:
  name: "Bestellung kaufen"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{host}}{{purchaseLink}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status wechselt auf ORDERED", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().state).to.equal("ORDERED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
