info:
  name: "Summe prüfen"
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}{{itemsLink}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // total = Summe(Preis * Menge); die Preise stehen nur am Produkt
        let sum = 0;
        for (const item of res.getBody().items) {
          const r = await bru.sendRequest({ method: "GET", url: bru.getEnvVar("baseUrl") + "/products/" + item.product });
          sum += r.data.price * item.quantity;
        }

        test("Bestellung hat 2 Positionen", function () {
          expect(res.getBody().items).to.have.lengthOf(2);
        });

        test("total entspricht der Summe der Positionen", function () {
          expect(bru.getVar("orderTotal")).to.be.closeTo(sum, 0.001);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
