info:
  name: "Vendoren abrufen"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/vendors"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Es gibt Vendoren", function () {
          expect(res.getBody().vendors).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
