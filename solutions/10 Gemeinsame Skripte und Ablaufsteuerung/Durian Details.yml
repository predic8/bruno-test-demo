info:
  name: "Durian Details"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/products/{{durianId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Nur ausführen, wenn die Suche etwas gefunden hat
        if (!bru.getVar("durianId")) {
          console.log("Keine Durian gefunden - Request wird übersprungen");
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("Durian ist abrufbar", function () {
          expect(res.getBody().name).to.contain("Durian");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
