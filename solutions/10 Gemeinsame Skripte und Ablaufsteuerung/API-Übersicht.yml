info:
  name: "API-Übersicht"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Übersicht verlinkt die Produkte", function () {
          expect(JSON.stringify(res.getBody())).to.contain("/products");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
