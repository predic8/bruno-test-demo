info:
  name: "Produkt lesen"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products/{{productId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Produkt ist abrufbar", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().id).to.equal(bru.getVar("productId"));
          expect(res.getBody().name).to.equal("Bruno-Kiwi");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
