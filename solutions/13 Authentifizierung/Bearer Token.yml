info:
  name: "Bearer Token"
  type: http
  seq: 4

http:
  method: GET
  url: "{{httpbinUrl}}/bearer"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // In echt käme das Token z. B. aus einem OAuth2-Token-Request
        bru.setVar("accessToken", "demo-" + Date.now());
    - type: tests
      code: |-
        test("Token wird akzeptiert und zurückgegeben", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().token).to.equal(bru.getVar("accessToken"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
