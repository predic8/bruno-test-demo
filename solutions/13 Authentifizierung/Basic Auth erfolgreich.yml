info:
  name: "Basic Auth erfolgreich"
  type: http
  seq: 1

http:
  method: GET
  url: "{{httpbinUrl}}/basic-auth/{{authUser}}/{{authPassword}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Mit korrekten Credentials: 200", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.deep.equal({ authenticated: true, user: "kursteilnehmer" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
