info:
  name: "Basic Auth falsches Passwort"
  type: http
  seq: 2

http:
  method: GET
  url: "{{httpbinUrl}}/basic-auth/{{authUser}}/{{authPassword}}"
  auth:
    type: basic
    username: "{{authUser}}"
    password: "falsch"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
