info:
  name: "Sortiment des Vendors prüfen"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/vendors/{{vendorId}}/products"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Vendor führt das neue Produkt", function () {
          const ids = res.getBody().products.map((p) => p.id);
          expect(ids).to.include(bru.getVar("productId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
