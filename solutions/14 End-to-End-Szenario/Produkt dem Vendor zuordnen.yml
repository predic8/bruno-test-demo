info:
  name: "Produkt dem Vendor zuordnen"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/vendors/{{vendorId}}/products/{{productId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
