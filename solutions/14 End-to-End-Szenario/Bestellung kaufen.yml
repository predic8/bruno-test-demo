info:
  name: "Bestellung kaufen"
  type: http
  seq: 7

http:
  method: PUT
  url: "{{host}}{{purchaseLink}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.state
      operator: eq
      value: "ORDERED"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
