info:
  name: "Bestellung anlegen"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/customers/{{customerId}}/orders"
  body:
    type: json
    data: |-
      {
        "items": [
          { "product": {{productId}}, "quantity": 4 }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("purchaseLink", res.getBody().actions.purchase.link);
        bru.setVar("cancelLink", res.getBody().actions.cancel.link);
    - type: tests
      code: |-
        test("Bestellung angelegt, total = 4 x 2.50", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody().total).to.be.closeTo(10, 0.001);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
