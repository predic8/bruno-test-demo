name: API-Tests
on: [push, workflow_dispatch]

jobs:
  bruno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @usebruno/cli
      - run: echo "HTTPBIN_PASSWORD=${{ secrets.HTTPBIN_PASSWORD }}" > .env
      - run: mkdir -p reports
      - run: bru run -r --env fruitshop --reporter-junit reports/junit.xml --reporter-html reports/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-report
          path: solutions/reports
