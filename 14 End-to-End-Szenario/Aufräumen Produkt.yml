info:
  name: "Aufräumen Produkt"
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/products/{{productId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.deleteVar("runId");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
