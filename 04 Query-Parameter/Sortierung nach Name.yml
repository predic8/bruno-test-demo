info:
  name: "Sortierung nach Name"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/products?sort=name&order=asc&limit=20"
  params:
    - name: sort
      value: "name"
      type: query
    - name: order
      value: "asc"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Namen sind aufsteigend sortiert", function () {
          const names = res.getBody().products.map((p) => p.name);
          for (let i = 1; i < names.length; i++) {
            expect(names[i - 1] <= names[i], `${names[i - 1]} vor ${names[i]}`).to.be.true;
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
