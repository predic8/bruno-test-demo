info:
  name: "Seite 1"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/products?start=1&limit=5"
  params:
    - name: start
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("nextLink", res.getBody().meta.next_link);
        bru.setVar("page1Ids", res.getBody().products.map((p) => p.id));
    - type: tests
      code: |-
        const meta = res.getBody().meta;

        test("meta passt zu den Parametern", function () {
          expect(meta.start).to.equal(1);
          expect(meta.limit).to.equal(5);
        });

        test("Es gibt einen next_link", function () {
          expect(meta.next_link).to.contain("start=6");
        });

        test("Auf Seite 1 gibt es keinen previous_link", function () {
          expect(meta).to.not.have.property("previous_link");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
