info:
  name: "Preis zu hoch"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {
        "name": "Bruno-Gold-Apfel",
        "price": 2000
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status ist 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Content-Type ist application/problem+json", function () {
          expect(res.getHeader("content-type")).to.contain("application/problem+json");
        });

        test("Meldung nennt das Maximum", function () {
          const msg = res.getBody().validation.errors["REQUEST/BODY#/price"][0].message;
          expect(msg).to.contain("maximum of 1000");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
