info:
  name: "Unbekanntes Produkt"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/products/999999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status ist 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Fehlermeldung nennt die id", function () {
          expect(res.getBody().message).to.contain("999999");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
