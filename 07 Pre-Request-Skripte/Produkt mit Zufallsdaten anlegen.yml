info:
  name: "Produkt mit Zufallsdaten anlegen"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/products"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require("uuid");

        const product = {
          name: "Bruno-" + Date.now(),                          // eindeutig, max. 30 Zeichen
          price: Math.round((Math.random() * 10 + 0.5) * 100) / 100
        };

        bru.setVar("expectedProduct", product);
        req.setBody(product);
        req.setHeader("X-Request-Id", uuidv4());
    - type: after-response
      code: |-
        bru.setVar("productId", res.getBody().id);
    - type: tests
      code: |-
        test("Server übernimmt die generierten Daten", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getBody()).to.include(bru.getVar("expectedProduct"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
