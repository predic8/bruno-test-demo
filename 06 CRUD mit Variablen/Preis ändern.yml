info:
  name: "Preis ändern"
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "price": 0.99
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("PATCH ändert nur den Preis", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().price).to.equal(0.99);
          expect(res.getBody().name).to.equal("Bruno-Gold-Kiwi");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
