info:
  name: "Ohne Credentials"
  type: http
  seq: 3

http:
  method: GET
  url: "{{httpbinUrl}}/basic-auth/{{authUser}}/{{authPassword}}"
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
