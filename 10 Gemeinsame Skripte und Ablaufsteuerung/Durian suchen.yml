info:
  name: "Durian suchen"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/products?name=Durian"
  params:
    - name: name
      value: "Durian"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const hits = res.getBody().products;
        if (hits.length > 0) {
          bru.setVar("durianId", hits[0].id);
        } else {
          bru.deleteVar("durianId");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
